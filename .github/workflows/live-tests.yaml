name: Live Extension Tests

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  push:
    branches:
      - "generic"
    paths:
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - "compose*.yaml"
      - "tsconfig.json"
      - "jest.config.cjs"
      - ".eslintrc.js"
      - "package*.json"
      - ".github/workflows/live-tests.yaml"
      - ".github/workflows/main.yml"
  pull_request:
    paths:
      - "src/**"
      - "assets/**"
      - "scripts/**"
      - "compose*.yaml"
      - "tsconfig.json"
      - "jest.config.cjs"
      - ".eslintrc.js"
      - "package*.json"
      - ".github/workflows/live-tests.yaml"
      - ".github/workflows/main.yml"

permissions:
  contents: read

concurrency:
  group: live-extension-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-tests:
    name: Test all extensions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Record start time
        id: started
        run: echo "timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check existing tests, types, lint, and Mana bundles
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build -- --output dist
      - name: Start test-only Chromium transport
        run: docker compose up -d --build --wait --wait-timeout 90
      - name: Run Mana live tests
        id: tests
        env:
          FLARESOLVERR_URL: http://127.0.0.1:8191
        run: |
          set -o pipefail
          mkdir -p bundles/live-status
          npm run test:extensions 2>&1 | tee bundles/live-status/mana.log
      - name: Capture timestamped results
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          TEST_STARTED_AT: ${{ steps.started.outputs.timestamp }}
          TESTED_SHA: ${{ github.sha }}
        run: node scripts/test-status.mjs capture
      - name: Collect structured report
        if: always()
        run: |
          mkdir -p bundles/live-status
          if [ -f bundles/live-test-results.json ]; then
            cp bundles/live-test-results.json bundles/live-status/mana.json
          fi
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-results
          retention-days: 7
          path: bundles/live-status/

      - name: Stop test-only Chromium transport
        if: always()
        run: docker compose down

  publish-status:
    name: Update README status
    needs: live-tests
    if: >-
      always() && github.event_name != 'pull_request' &&
      github.ref_name == github.event.repository.default_branch &&
      needs.live-tests.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout latest default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download results
        uses: actions/download-artifact@v4
        with:
          name: live-test-results
          path: bundles/live-status
      - name: Update the status section and history
        run: npm run update:test-status
      - name: Commit README results
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md reports/live-tests-history.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: update extension test results"
          # Reapply the status to the latest README if the branch advanced during testing.
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then
              exit 0
            fi
            git fetch origin "$DEFAULT_BRANCH"
            git reset --hard FETCH_HEAD
            npm run update:test-status
            git add README.md reports/live-tests-history.json
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "docs: update extension test results"
          done
          exit 1

